org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kompilasi inkremental Kotlin dimatikan karena proyek dan cache paket bisa
# berada di DRIVE BERBEDA (proyek di D:, PUB_CACHE bawaan di C:\Users\...).
# RelocatableFileToPathConverter milik Kotlin menghitung jalur RELATIF dari
# folder android proyek ke berkas sumber plugin; di Windows jalur relatif
# antar-drive tak ada, sehingga ia melempar
#   IllegalArgumentException: this and base files have different roots
# lalu gagal menutup cache inkrementalnya dan menjatuhkan seluruh build
# (terlihat di :mobile_scanner: dan :url_launcher_android:compileReleaseKotlin).
#
# Konsekuensinya hanya build ulang jadi lebih lambat — hasil APK-nya sama.
# Jangan dihidupkan lagi kecuali seluruh anggota tim menaruh proyek dan
# PUB_CACHE di drive yang sama.
kotlin.incremental=false
